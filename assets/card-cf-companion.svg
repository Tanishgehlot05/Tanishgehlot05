<svg xmlns="http://www.w3.org/2000/svg" width="880" height="148" viewBox="0 0 880 148" role="img" aria-labelledby="title desc">
  <title id="title">CF Companion</title>
  <desc id="desc">A GNOME Shell extension that puts Codeforces countdowns and desktop reminders in reach, with an optional service for Telegram alerts and friend standings.</desc>
  <rect width="880" height="148" rx="10" fill="#F4F6F8" stroke="#CDD6E0"/>
  <text x="30" y="44" fill="#1D2B3A" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700">CF Companion</text>
  <text x="30" y="75" fill="#425367" font-family="'Segoe UI', Arial, sans-serif" font-size="16">Codeforces countdowns and desktop reminders, right in the GNOME top bar.</text>
  <text x="30" y="108" fill="#526274" font-family="'Segoe UI', Arial, sans-serif" font-size="14">An optional Node.js service adds Telegram alerts and friend standings.</text>
  <path d="M604 26v96" stroke="#CDD6E0"/>
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <circle cx="650" cy="73" r="20" fill="#E5ECF5" stroke="#3D67C6" stroke-width="2"/>
    <path d="M650 61v13l9 6" fill="none" stroke="#3D67C6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M676 73h31" stroke="#7B8B9C" stroke-width="1.5"/><path d="m703 69 6 4-6 4" fill="none" stroke="#7B8B9C" stroke-width="1.5"/>
    <rect x="712" y="52" width="137" height="42" rx="5" fill="#E5ECF5" stroke="#AAB8C7" stroke-width="1.5"/>
    <text x="780" y="69" fill="#1D2B3A" font-size="13">GNOME top bar</text>
    <text x="780" y="85" fill="#526274" font-size="11">countdown · reminders</text>
    <text x="650" y="110" fill="#526274" font-size="12">Codeforces</text>
  </g>
  <text x="30" y="134" fill="#3D67C6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">JavaScript  /  GNOME Shell</text>
</svg>
