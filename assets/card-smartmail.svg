<svg xmlns="http://www.w3.org/2000/svg" width="880" height="148" viewBox="0 0 880 148" role="img" aria-labelledby="title desc">
  <title id="title">SmartMail AI Agent</title>
  <desc id="desc">A Gmail assistant that uses Gemini to sort incoming email, track deadlines, and send useful summaries and alerts through Telegram and a dashboard.</desc>
  <rect width="880" height="148" rx="10" fill="#F4F6F8" stroke="#CDD6E0"/>
  <text x="30" y="44" fill="#1D2B3A" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700">SmartMail AI Agent</text>
  <text x="30" y="75" fill="#425367" font-family="'Segoe UI', Arial, sans-serif" font-size="16">Gemini helps sort incoming mail, track deadlines, and prepare summaries.</text>
  <text x="30" y="108" fill="#526274" font-family="'Segoe UI', Arial, sans-serif" font-size="14">Telegram brings the alerts; a dashboard tracks emails and deadlines.</text>
  <path d="M604 26v96" stroke="#CDD6E0"/>
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <rect x="623" y="59" width="64" height="36" rx="5" fill="#E5ECF5" stroke="#AAB8C7" stroke-width="1.5"/>
    <text x="655" y="82" fill="#1D2B3A" font-size="13">Gmail</text>
    <path d="M687 77h25" stroke="#7B8B9C" stroke-width="1.5"/><path d="m708 73 6 4-6 4" fill="none" stroke="#7B8B9C" stroke-width="1.5"/>
    <rect x="716" y="59" width="68" height="36" rx="5" fill="#E5ECF5" stroke="#AAB8C7" stroke-width="1.5"/>
    <text x="750" y="82" fill="#1D2B3A" font-size="13">Gemini</text>
    <path d="M784 77h25" stroke="#7B8B9C" stroke-width="1.5"/><path d="m805 73 6 4-6 4" fill="none" stroke="#7B8B9C" stroke-width="1.5"/>
    <rect x="813" y="59" width="48" height="36" rx="5" fill="#E5ECF5" stroke="#AAB8C7" stroke-width="1.5"/>
    <text x="837" y="82" fill="#1D2B3A" font-size="12">Telegram</text>
    <text x="741" y="118" fill="#526274" font-size="11">alerts · summaries · dashboard</text>
  </g>
  <text x="30" y="134" fill="#3D67C6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Node.js  /  Gmail API  /  Telegram</text>
</svg>
